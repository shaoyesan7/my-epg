- name: Ⓜ️ 微软服务
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
- name: 🎮 游戏平台
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
- name: ⛔ 广告拦截
  type: select
  proxies:
