mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
find-process-mode: 'off'
external-controller: 0.0.0.0:9090
secret: ''
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - time.*.gov
  - pool.ntp.org
  - +.music.163.com
  - +.126.net
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    geosite:cn,private:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
    geosite:geolocation-!cn:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - ♻️ 自动选择
  - 🔯 故障转移
  - 🇭🇰 香港节点
  - 🇹🇼 台湾节点
  - 🇯🇵 日本节点
  - 🇰🇷 韩国节点
  - 🇸🇬 新加坡节点
  - 🇺🇸 美国节点
  - 🇳🇱 荷兰节点
  - DIRECT
  include-all-proxies: true
- name: ♻️ 自动选择
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  include-all-proxies: true
- name: 🔯 故障转移
  type: fallback
  url: https://www.gstatic.com/generate_204
  interval: 180
  lazy: true
  include-all-proxies: true
- name: 🇭🇰 香港节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(港|香港|HK|Hong Kong|HKG)
  include-all-proxies: true
- name: 🇹🇼 台湾节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(台|台湾|台北|新北|TW|Taiwan|TPE)
  include-all-proxies: true
- name: 🇯🇵 日本节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(日|日本|东京|大阪|JP|Japan|Tokyo|Osaka|NRT|HND)
  include-all-proxies: true
- name: 🇰🇷 韩国节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(韩|韩国|首尔|KR|Korea|Seoul|ICN)
  include-all-proxies: true
- name: 🇸🇬 新加坡节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(新加坡|狮城|SG|Singapore|SIN)
  include-all-proxies: true
- name: 🇺🇸 美国节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(美|美国|洛杉矶|圣何塞|西雅图|纽约|达拉斯|US|USA|America|LAX|SJC|SEA)
  include-all-proxies: true
- name: 🇳🇱 荷兰节点
  type: url-test
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  lazy: true
  filter: (?i)(荷兰|阿姆斯特丹|NL|Netherlands|Amsterdam|AMS)
  include-all-proxies: true
- name: 🤖 AI服务
  type: select
  proxies:
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🇸🇬 新加坡节点
  - 🚀 节点选择
- name: 💎 Gemini
  type: select
  proxies:
  - 🇺🇸 美国节点
  - 🇯🇵 日本节点
  - 🚀 节点选择
- name: 🔍 Google
  type: select
  proxies:
  - 🚀 节点选择
  - ♻️ 自动选择
  - 🇭🇰 香港节点
  - 🇹🇼 台湾节点
  - 🇯🇵 日本节点
  - 🇺🇸 美国节点
- name: 🐙 GitHub
