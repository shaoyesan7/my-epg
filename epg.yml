name: build-epg

# 每天北京时间 06:30 和 18:30 各生成一次（UTC 22:30 / 10:30）
on:
  schedule:
    - cron: "30 22 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build merged EPG
        run: python3 build_epg.py epg.xml
      - name: Commit updated EPG
        run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add epg.xml epg.xml.gz stats.json
          git commit -m "update epg $(date -u +%F)" || echo "no changes"
          git push
