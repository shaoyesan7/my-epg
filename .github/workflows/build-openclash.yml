name: build-openclash

on:
  schedule:
    - cron: '15 0,12 * * *'   # UTC 00:15 / 12:15 = Beijing 08:15 / 20:15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Fetch subscription
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: curl -fsSL --retry 3 "$SUB_URL" -o sub-raw.yaml
      - name: Generate config
        run: python3 openclash-gen/gen.py sub-raw.yaml
      - name: Publish to secret gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          content = open('openclash.yaml', encoding='utf-8').read()
          data = json.dumps({"files": {"openclash.yaml": {"content": content}}}).encode('utf-8')
          req = urllib.request.Request(
              'https://api.github.com/gists/' + os.environ['GIST_ID'],
              data=data, method='PATCH',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as r:
              print('gist updated, HTTP', r.status)
          PY
