name: cdn-probe

on:
  push:
    paths:
      - '.github/workflows/cdn-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe CDN
        run: |
          set +e
          OUT=probe_result.txt
          echo "cdn-probe run $(date -u +%FT%TZ)" > $OUT
          probe() {
            echo "--- curl $1" >> $OUT
            curl -sS -o /dev/null -w "http_code=%{http_code} size=%{size_download} time=%{time_total}\n" --max-time 30 "$1" >> $OUT 2>&1
            echo "curl_exit=$?" >> $OUT
          }
          probe "https://cdn-1.ggjav.com/media/video/large_301262.jpg"
          probe "https://cdn-1.ggjav.com/media/video/small_301262.jpg"
          probe "https://cdn-1.ggjav.com/media/model/18825.jpg"
          probe "https://hohoj.tv/"
          pip install -q curl_cffi >> $OUT 2>&1
          echo "--- curl_cffi chrome impersonation large_301262.jpg" >> $OUT
          python3 - >> $OUT 2>&1 <<'PYEOF'
          from curl_cffi import requests as cr
          u = 'https://cdn-1.ggjav.com/media/video/large_301262.jpg'
          try:
              r = cr.get(u, impersonate='chrome', timeout=30)
              print('status=%s content-type=%s len=%s' % (r.status_code, r.headers.get('content-type'), len(r.content)))
          except Exception as e:
              print('ERROR %s' % e)
          PYEOF
          cat $OUT
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add probe_result.txt
          git commit -m "cdn probe result"
          git push
